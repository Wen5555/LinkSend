name: desktop-wails3-checks
on:
  push:
  pull_request:
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Install Wails 3 CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOBIN = "$env:GITHUB_WORKSPACE\.wails-bin"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.wails-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\.wails-bin\wails3.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:GITHUB_WORKSPACE\.wails-bin;$env:PATH"
      - name: Generate Wails 3 bindings
        working-directory: apps/desktop
        shell: pwsh
        run: |
          wails3 generate bindings -ts -i -clean=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend checks
        working-directory: apps/desktop/frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop Go and production checks
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOWORK = "off"
          go env GOMOD GOWORK
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wails3 task build ARCH=amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
