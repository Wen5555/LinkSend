name: desktop-wails3-checks
on:
  push:
  pull_request:
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Install Wails 3 CLI
        shell: pwsh
        run: |
          $env:GOBIN = "$env:GITHUB_WORKSPACE\.wails-bin"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
          "$env:GITHUB_WORKSPACE\.wails-bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wails3 version
      - name: Desktop Go checks
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:GOWORK = "off"
          go env GOMOD GOWORK
          go mod verify
          go test ./...
          go build ./...
          wails3 task build ARCH=amd64
      - name: Frontend checks
        working-directory: apps/desktop/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run build
