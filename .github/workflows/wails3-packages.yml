name: wails3-packages

env:
  PRODUCT_VERSION: 0.6.2

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wails3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-2022
            os: windows
            arch: amd64
          - name: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64
          - name: macos-amd64
            runner: macos-15-intel
            os: macos
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Verify committed source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Install Wails 3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.18
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/wails3" version
      - name: Verify core module
        shell: bash
        run: GOWORK=off go test ./...
      - name: Verify Windows share handoff
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          dotnet run -c Release --project apps/desktop/native-share/windows -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows temporary code native clipboard
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        shell: pwsh
        env:
          GOWORK: 'off'
          LINKSEND_TEMP_SHARE_NATIVE_CLIPBOARD: '1'
          LINKSEND_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          LINKSEND_RUNNER_OS: ${{ runner.os }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $testName = 'TestDesktopTemporaryCodeNativeClipboardDoesNotSyncOrCache'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw 'Runner evidence directory is unavailable; native clipboard test was not run.' }
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'linksend-native-copy'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $jsonLog = Join-Path $evidenceDir 'native-copy.jsonl'
          $stderrLog = Join-Path $evidenceDir 'native-copy.stderr.log'
          $summaryLog = Join-Path $evidenceDir 'native-copy-summary.json'
          '' | Set-Content -LiteralPath $jsonLog -Encoding utf8
          '' | Set-Content -LiteralPath $stderrLog -Encoding utf8
          $summary = [ordered]@{
            test_name = $testName
            runner_context_environment = $env:LINKSEND_RUNNER_ENVIRONMENT
            runner_environment = $env:RUNNER_ENVIRONMENT
            runner_context_os = $env:LINKSEND_RUNNER_OS
            runner_os = $env:RUNNER_OS
            github_actions = $env:GITHUB_ACTIONS
            outcome = 'NOT_RUN'
            reason = 'RUNNER_GUARD_PENDING'
            fixture = 'untouched'
            exit_code = $null
            target_run = 0
            target_pass = 0
            skip = 0
            fail = 0
          }
          function Save-NativeCopySummary {
            $summary | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $summaryLog -Encoding utf8
          }
          function Stop-NativeCopyCheck([string]$outcome, [string]$reason) {
            $summary.outcome = $outcome
            $summary.reason = $reason
            Save-NativeCopySummary
            throw "Native clipboard verification stopped: $reason"
          }
          Save-NativeCopySummary
          if ($env:LINKSEND_RUNNER_ENVIRONMENT -ceq 'self-hosted' -or $env:RUNNER_ENVIRONMENT -ceq 'self-hosted') {
            Stop-NativeCopyCheck 'NOT_RUN_SELF_HOSTED' 'SELF_HOSTED_CLIPBOARD_IS_PROTECTED'
          }
          if (-not ($IsWindows -and $env:LINKSEND_RUNNER_ENVIRONMENT -ceq 'github-hosted' -and
            $env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and $env:LINKSEND_RUNNER_OS -ceq 'Windows' -and
            $env:RUNNER_OS -ceq 'Windows' -and $env:GITHUB_ACTIONS -ceq 'true')) {
            Stop-NativeCopyCheck 'NOT_RUN_UNVERIFIED_RUNNER' 'GITHUB_HOSTED_WINDOWS_CONTEXT_REQUIRED'
          }
          # Only this disposable GitHub-hosted runner may replace its clipboard fixture.
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class LinkSendNativeClipboardFixture {
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool OpenClipboard(IntPtr owner);
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool EmptyClipboard();
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool CloseClipboard();
          }
          '@
            $opened = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              if ([LinkSendNativeClipboardFixture]::OpenClipboard([IntPtr]::Zero)) { $opened = $true; break }
              Start-Sleep -Milliseconds 50
            }
            if (-not $opened) { throw 'Clipboard fixture could not be opened.' }
            $cleared = $false
            $closed = $false
            try { $cleared = [LinkSendNativeClipboardFixture]::EmptyClipboard() }
            finally { $closed = [LinkSendNativeClipboardFixture]::CloseClipboard() }
            if (-not ($cleared -and $closed)) { throw 'Clipboard fixture could not be established.' }
          } catch {
            Stop-NativeCopyCheck 'FAILED' 'EMPTY_CLIPBOARD_FIXTURE_FAILED'
          }
          $summary.fixture = 'empty_clipboard_created'
          $summary.outcome = 'RUNNING'
          $summary.reason = 'NATIVE_TEST_PENDING'
          Save-NativeCopySummary
          try {
            go test -json -count=1 -run '^TestDesktopTemporaryCodeNativeClipboardDoesNotSyncOrCache$' -timeout 45s . 1> $jsonLog 2> $stderrLog
            $summary.exit_code = $LASTEXITCODE
          } catch {
            Stop-NativeCopyCheck 'FAILED' 'NATIVE_TEST_COMMAND_FAILED'
          }
          try {
            $events = @(Get-Content -LiteralPath $jsonLog | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          } catch {
            Stop-NativeCopyCheck 'FAILED' 'NATIVE_TEST_JSON_INVALID'
          }
          $summary.target_run = @($events | Where-Object { $_.Test -ceq $testName -and $_.Action -ceq 'run' }).Count
          $summary.target_pass = @($events | Where-Object { $_.Test -ceq $testName -and $_.Action -ceq 'pass' }).Count
          $summary.skip = @($events | Where-Object { $_.Action -ceq 'skip' }).Count
          $summary.fail = @($events | Where-Object { $_.Action -ceq 'fail' }).Count
          if ($null -eq $summary.exit_code -or $summary.exit_code -ne 0 -or $summary.target_run -ne 1 -or
            $summary.target_pass -ne 1 -or $summary.skip -ne 0 -or $summary.fail -ne 0) {
            Stop-NativeCopyCheck 'FAILED' 'NATIVE_TEST_MUST_RUN_AND_PASS_WITHOUT_SKIP'
          }
          $summary.outcome = 'PASS'
          $summary.reason = 'NATIVE_CODE_COPY_AND_SUBSEQUENT_SYNC_VERIFIED'
          Save-NativeCopySummary
      - name: Upload Windows native clipboard evidence
        if: always() && matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-code-clipboard-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/linksend-native-copy/native-copy.jsonl
            ${{ runner.temp }}/linksend-native-copy/native-copy.stderr.log
            ${{ runner.temp }}/linksend-native-copy/native-copy-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify macOS share handoff
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          TEST_BIN="$RUNNER_TEMP/linksend-share-store-tests"
          xcrun swiftc -swift-version 5 -framework Cocoa -framework UniformTypeIdentifiers \
            apps/desktop/native-share/macos/ShareStore.swift \
            apps/desktop/native-share/macos/ShareStoreTests.swift -o "$TEST_BIN"
          "$TEST_BIN"
      - name: Build Windows amd64
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOWORK = "off"
          wails3 task package ARCH=${{ matrix.arch }} INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "bin/release" | Out-Null
          Copy-Item "bin/LinkSend.exe", "README-WINDOWS-TEST.txt" -Destination "bin/release"
          $helper = Get-Content -LiteralPath 'bin/clipboard-helper-build.json' -Raw | ConvertFrom-Json
          if ($helper.source_commit -ne '${{ github.sha }}' -or !$helper.source_clean -or $helper.target_os -ne 'windows' -or $helper.target_arch -ne '${{ matrix.arch }}') { throw 'Clipboard helper source/platform mismatch' }
          if ($helper.helper_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $helper.source_digest -cnotmatch '^[0-9a-f]{64}$' -or $helper.helper_relative_path -cne "native-clipboard/$($helper.helper_sha256)/LinkSendClipboardFileHelper.exe") { throw 'Invalid clipboard helper manifest' }
          if ((Get-FileHash -LiteralPath "bin/$($helper.helper_relative_path)" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $helper.helper_sha256 -or (Get-FileHash -LiteralPath 'bin/LinkSend.exe' -Algorithm SHA256).Hash.ToLowerInvariant() -ne $helper.desktop_sha256) { throw 'Same-candidate build output changed' }
          $helperDestination = Join-Path 'bin/release' $helper.helper_relative_path
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $helperDestination) | Out-Null
          Copy-Item -LiteralPath "bin/$($helper.helper_relative_path)" -Destination $helperDestination
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $goVersion = (go version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeVersion = (node --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pnpmVersion = (pnpm --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wailsVersion = (wails3 version 2>&1 | Select-String -Pattern '^v3\.0\.0-beta\.18$' | Select-Object -First 1).Line.Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisVersion = (& makensis /VERSION 2>&1 | Select-Object -First 1).ToString().Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "product_version=$env:PRODUCT_VERSION"
            "protocol_version=1"
            "source_commit=${{ github.sha }}"
            "workflow_run=${{ github.run_id }}"
            "workflow_head_sha=${{ github.sha }}"
            "source_state=COMMITTED"
            "source_checkout_clean=true"
            "build_time_utc=$buildTime"
            "target_os=windows"
            "target_arch=amd64"
            "clipboard_helper_sha256=$($helper.helper_sha256)"
            "clipboard_helper_path=$($helper.helper_relative_path)"
            "clipboard_helper_source_commit=$($helper.source_commit)"
            "clipboard_helper_source_digest=$($helper.source_digest)"
            "clipboard_helper_source_clean=$($helper.source_clean.ToString().ToLowerInvariant())"
            "tool_go=$goVersion"
            "tool_node=$nodeVersion"
            "tool_pnpm=$pnpmVersion"
            "tool_wails=$wailsVersion"
            "tool_nsis=$nsisVersion"
            "package_validation=version_info_and_nsis_build_pass"
            "native_validation=not_run_in_workflow"
            "signing=unsigned"
            "notarization=not_applicable"
          ) | Set-Content -Encoding utf8 "bin/release/BUILD-INFO.txt"
          Compress-Archive -Path "bin/release/*" -DestinationPath "bin/LinkSend-v$env:PRODUCT_VERSION-windows-amd64-${{ github.sha }}.zip"
          Copy-Item "bin/LinkSend-amd64-installer.exe" "bin/LinkSend-v$env:PRODUCT_VERSION-windows-amd64-installer-${{ github.sha }}.exe"
          Copy-Item "bin/release/BUILD-INFO.txt" "$env:GITHUB_WORKSPACE/BUILD-INFO.txt"
          if ((Get-Item "bin/LinkSend.exe").VersionInfo.ProductVersion -ne $env:PRODUCT_VERSION) { throw "LinkSend.exe ProductVersion mismatch" }
          if ((Get-Item "bin/LinkSend-amd64-installer.exe").VersionInfo.ProductVersion -ne $env:PRODUCT_VERSION) { throw "installer ProductVersion mismatch" }
      - name: Build macOS DMG
        if: matrix.os == 'macos'
        shell: bash
        run: |
          bash scripts/build-macos.sh --arch ${{ matrix.arch }} --format dmg
          cp "apps/desktop/bin/macos-${{ matrix.arch }}/LinkSend.dmg" "LinkSend-v${PRODUCT_VERSION}-macos-${{ matrix.arch }}-${{ github.sha }}.dmg"
          BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GO_VERSION=$(go version)
          NODE_VERSION=$(node --version)
          PNPM_VERSION=$(pnpm --version)
          WAILS_VERSION=$(wails3 version 2>&1 | grep -E '^v3\.0\.0-beta\.18$' | head -n 1)
          CLANG_VERSION=$(clang --version | head -n 1)
          {
            echo "product_version=${PRODUCT_VERSION}"
            echo "protocol_version=1"
            echo "source_commit=${{ github.sha }}"
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_head_sha=${{ github.sha }}"
            echo "source_state=COMMITTED"
            echo "source_checkout_clean=true"
            echo "build_time_utc=${BUILD_TIME_UTC}"
            echo "target_os=macos"
            echo "target_arch=${{ matrix.arch }}"
            echo "tool_go=${GO_VERSION}"
            echo "tool_node=${NODE_VERSION}"
            echo "tool_pnpm=${PNPM_VERSION}"
            echo "tool_wails=${WAILS_VERSION}"
            echo "tool_clang=${CLANG_VERSION}"
            echo "package_validation=mount_bundle_id_arch_codesign_pass"
            echo "native_validation=not_run_in_workflow"
            echo "signing=ad-hoc"
            echo "notarization=not_run"
          } > BUILD-INFO.txt
      - name: Hash package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows ]; then
            sha256sum "apps/desktop/bin/LinkSend-v${PRODUCT_VERSION}-windows-amd64-${{ github.sha }}.zip" "apps/desktop/bin/LinkSend-v${PRODUCT_VERSION}-windows-amd64-installer-${{ github.sha }}.exe" > SHA256SUMS.txt
          else
            shasum -a 256 "LinkSend-v${PRODUCT_VERSION}-macos-${{ matrix.arch }}-${{ github.sha }}.dmg" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LinkSend-v${{ env.PRODUCT_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/desktop/bin/LinkSend-v${{ env.PRODUCT_VERSION }}-windows-amd64-${{ github.sha }}.zip
            apps/desktop/bin/LinkSend-v${{ env.PRODUCT_VERSION }}-windows-amd64-installer-${{ github.sha }}.exe
            LinkSend-v${{ env.PRODUCT_VERSION }}-macos-${{ matrix.arch }}-${{ github.sha }}.dmg
            BUILD-INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
