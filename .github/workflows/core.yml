name: core
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
