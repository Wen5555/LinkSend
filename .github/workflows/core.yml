name: core
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: GOWORK=off go mod verify
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go build ./...
      - run: GOWORK=off go test -race ./...
