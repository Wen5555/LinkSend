# Exact project entry; the existing wildcard sites remain in place.
server {
    listen 80;
    listen [::]:80;
    server_name linksend.oooai.de;
    access_log off;
    return 308 https://linksend.oooai.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name linksend.oooai.de;
    ssl_certificate /etc/nginx/ssl/cloudflare/oooai.de/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/oooai.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/linksend-error.log warn;
    client_max_body_size 1m;

    location / {
        proxy_pass https://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name linksend-backend.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/linksend/tls/backend-ca.crt;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
